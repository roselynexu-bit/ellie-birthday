<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#8a6a4d"/>
    <stop offset="0.62" stop-color="#e8c496"/>
    <stop offset="1" stop-color="#f6dcb0"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f6dcb0" stop-opacity="0.95"/>
    <stop offset="0.45" stop-color="#f6dcb0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#f6dcb0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2f26" stop-opacity="0"/>
    <stop offset="1" stop-color="#3a2f26" stop-opacity="0.55"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.48" r="0.78">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#1a1410" stop-opacity="0.42"/>
  </radialGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="softbig" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="19.2"/>
  </filter></defs>

    <rect width="900" height="1200" fill="url(#sky)"/>
    <circle cx="450" cy="432" r="360" fill="url(#sun)"/>
    <ellipse cx="450" cy="480" rx="135" ry="204.00000000000003" fill="#3a2f26" opacity="0.55" filter="url(#softbig)"/>
    <ellipse cx="450" cy="936" rx="270" ry="240" fill="#3a2f26" opacity="0.5" filter="url(#softbig)"/>
    <rect x="0" y="1056" width="900" height="144" fill="#3a2f26" opacity="0.6" filter="url(#soft)"/>
    <g opacity="0.12" fill="#f6dcb0" filter="url(#softbig)">
      <circle cx="180" cy="288" r="63.00000000000001"/>
      <circle cx="720" cy="672.0000000000001" r="45"/>
    </g>
<rect width="900" height="1200" fill="url(#fade)" opacity="0.5"/>
<rect width="900" height="1200" fill="url(#vig)"/>
<rect width="900" height="1200" filter="url(#grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
<g font-family="Helvetica,Arial,sans-serif" font-size="29" fill="#f6efe2" opacity="0.5" letter-spacing="2">01A</g>
</svg>
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #262124; display: flex; gap: 40px; padding: 50px; font-family: sans-serif; color: #eee; }
  .box { text-align: center; }
  svg { width: 180px; height: 180px; background: #faf4ea; border-radius: 12px; }
</style>
</head>
<body>

<div class="box">
  <h3>Original (Hairclip Bow on top)</h3>
  <svg viewBox="-30 -30 60 60">
    <g transform="scale(1.2)">
      <!-- Star -->
      <path d="M0 -17 L4.6 -5.4 L16.6 -4.2 L7.4 3.2 L10.4 13.6 L0 7.8 L-10.4 13.6 L-7.4 3.2 L-16.6 -4.2 L-4.6 -5.4 Z" fill="#9f584a" stroke="#faf4ea" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Old Bow -->
      <g class="bow">
        <path d="M0 -18.5 C-4 -26 -13 -26 -12.5 -19.5 C-12 -14 -4 -14.5 0 -18.5 Z M0 -18.5 C4 -26 13 -26 12.5 -19.5 C12 -14 4 -14.5 0 -18.5 Z" fill="#c09094" stroke="#181416" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="0" cy="-18" r="2.6" fill="#c9867f" stroke="#181416" stroke-width="1.5"/>
      </g>
    </g>
  </svg>
</div>

<div class="box">
  <h3>Concept A: Gift Cross-Ribbon + Center Bow</h3>
  <svg viewBox="-30 -30 60 60">
    <g transform="scale(1.2)">
      <!-- Shadow -->
      <path d="M0 -17 L4.6 -5.4 L16.6 -4.2 L7.4 3.2 L10.4 13.6 L0 7.8 L-10.4 13.6 L-7.4 3.2 L-16.6 -4.2 L-4.6 -5.4 Z" transform="translate(1.5 2)" fill="rgba(20,18,20,0.25)" stroke="none"/>
      <!-- Star -->
      <path d="M0 -17 L4.6 -5.4 L16.6 -4.2 L7.4 3.2 L10.4 13.6 L0 7.8 L-10.4 13.6 L-7.4 3.2 L-16.6 -4.2 L-4.6 -5.4 Z" fill="#9f584a" stroke="#faf4ea" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Gift Ribbons Wrapping the Star -->
      <!-- Vertical ribbon band -->
      <path d="M-2.2 -14 L2.2 -14 L2.2 7 L-2.2 7 Z" fill="#c09094" stroke="#181416" stroke-width="1.2"/>
      <path d="M-0.8 -14 L0.8 -14 L0.8 7 L-0.8 7 Z" fill="#d8a4a8" opacity="0.6"/>
      <!-- Horizontal ribbon band -->
      <path d="M-13 -2.2 L13 -2.2 L13 2.2 L-13 2.2 Z" fill="#c09094" stroke="#181416" stroke-width="1.2"/>
      <path d="M-13 -0.8 L13 -0.8 L13 0.8 L-13 0.8 Z" fill="#d8a4a8" opacity="0.6"/>
      
      <!-- Ribbon Tails draping down -->
      <path d="M-1 1 C-2 5 -5 9 -7 13 L-4.5 12.2 L-3.5 14 C-2 10 0 6 0.5 1 Z" fill="#b37379" stroke="#181416" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M1 1 C2 5 5 9 7.5 13.5 L6 11.8 L3.8 13.8 C3 9.5 1.5 5.5 0.5 1 Z" fill="#b37379" stroke="#181416" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Bow Loops -->
      <!-- Left loop -->
      <path d="M0 -0.5 C-3 -6 -11 -7 -10.5 -1.5 C-10 2.5 -3 1.5 0 -0.5 Z" fill="#c09094" stroke="#181416" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M-1 -0.5 C-3.5 -4 -8 -4.5 -7.5 -1.5 C-7 0.8 -3 0.8 -1 -0.5 Z" fill="#a86268" opacity="0.45"/>
      <!-- Right loop -->
      <path d="M0 -0.5 C3 -6 11 -7 10.5 -1.5 C10 2.5 3 1.5 0 -0.5 Z" fill="#c09094" stroke="#181416" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M1 -0.5 C3.5 -4 8 -4.5 7.5 -1.5 C7 0.8 3 0.8 1 -0.5 Z" fill="#a86268" opacity="0.45"/>

      <!-- Center Knot -->
      <ellipse cx="0" cy="-0.5" rx="2.4" ry="2.2" fill="#d8a4a8" stroke="#181416" stroke-width="1.4"/>
      <circle cx="-0.6" cy="-1.2" r="0.8" fill="#fff" opacity="0.6"/>
    </g>
  </svg>
</div>

<div class="box">
  <h3>Concept B: Diagonal Gift Wrap (Wrapped Star)</h3>
  <svg viewBox="-30 -30 60 60">
    <g transform="scale(1.2)">
      <!-- Shadow -->
      <path d="M0 -17 L4.6 -5.4 L16.6 -4.2 L7.4 3.2 L10.4 13.6 L0 7.8 L-10.4 13.6 L-7.4 3.2 L-16.6 -4.2 L-4.6 -5.4 Z" transform="translate(1.5 2)" fill="rgba(20,18,20,0.25)" stroke="none"/>
      <!-- Star -->
      <path d="M0 -17 L4.6 -5.4 L16.6 -4.2 L7.4 3.2 L10.4 13.6 L0 7.8 L-10.4 13.6 L-7.4 3.2 L-16.6 -4.2 L-4.6 -5.4 Z" fill="#9f584a" stroke="#faf4ea" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Diagonal Ribbon Sash 1 (top-left to bottom-right) -->
      <path d="M-8 -9 L-6 -11 L9 7 L7 9 Z" fill="#c09094" stroke="#181416" stroke-width="1.2"/>
      <!-- Diagonal Ribbon Sash 2 (top-right to bottom-left) -->
      <path d="M6 -11 L8 -9 L-7 9 L-9 7 Z" fill="#c09094" stroke="#181416" stroke-width="1.2"/>
      
      <!-- Ribbon Tails -->
      <path d="M-1 0 C-2 5 -6 9 -8 13.5 L-5 12.5 L-4 14.5 C-2 10.5 0 6 0.5 0 Z" fill="#b37379" stroke="#181416" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M1 0 C2 5 6 9.5 8.5 14 L6.5 12.5 L4.5 14.5 C3 10 1.5 5.5 0.5 0 Z" fill="#b37379" stroke="#181416" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Big Lush Bow -->
      <path d="M0 -1 C-3 -7 -12 -8 -11.5 -2 C-11 2.5 -3 1.5 0 -1 Z" fill="#c09094" stroke="#181416" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M-1 -1 C-3.5 -5 -9 -5.5 -8.5 -2 C-8 0.5 -3 0.5 -1 -1 Z" fill="#9e5259" opacity="0.45"/>
      <path d="M0 -1 C3 -7 12 -8 11.5 -2 C11 2.5 3 1.5 0 -1 Z" fill="#c09094" stroke="#181416" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M1 -1 C3.5 -5 9 -5.5 8.5 -2 C8 0.5 3 0.5 1 -1 Z" fill="#9e5259" opacity="0.45"/>

      <!-- Center Knot with fold creases -->
      <rect x="-2.2" y="-3" width="4.4" height="4" rx="1.8" fill="#d8a4a8" stroke="#181416" stroke-width="1.4"/>
      <line x1="-1" y1="-2" x2="-1" y2="0" stroke="#181416" stroke-width="0.8" opacity="0.5"/>
    </g>
  </svg>
</div>

</body>
</html>

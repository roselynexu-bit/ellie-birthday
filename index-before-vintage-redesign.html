<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AT TWENTY: CARNIVAL</title>
<meta name="description" content="A magical hand-drawn carnival palace, made for Ellie's twentieth birthday.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8E%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Shrikhand&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────── tokens ───────────────────────────── */
:root{
  --paper:#f8ecd2;
  --ink:#38313b;
  --ink-soft:#4a4250;
  --cream:#f6ead2;
  --red:#c65b4e;
  --pink:#dfa8b0;
  --blue:#8fb6d9;
  --green:#8a9b6e;
  --gold:#f6c945;
  --hand:'Gochi Hand','Comic Sans MS',cursive;
  --display:'Shrikhand',var(--hand);
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}

/* ───────────────────────────── base ───────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased}
svg{display:block}
.scene-wrap{position:fixed;inset:0}
.scene{position:absolute;inset:0;width:100%;height:100%}

/* scene visibility / switching */
#opening{visibility:visible;opacity:1;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
#globe-scene{visibility:hidden;opacity:0;transform:scale(.97);
  transition:opacity .9s ease .12s,transform .9s cubic-bezier(.2,.7,.2,1) .12s}
#globe-scene:target,#globe-scene.active{visibility:visible;opacity:1;transform:scale(1)}
html.js #opening:not(.active){visibility:hidden;opacity:0;transform:scale(1.04)}

/* ───────────────────────────── shared svg motion ───────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
.wheel{transform-box:view-box;transform-origin:1280px 415px;animation:spin 48s linear infinite}
@keyframes spinback{to{transform:rotate(-360deg)}}
.cab{transform-box:fill-box;transform-origin:center;animation:spinback 48s linear infinite}
@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(9px)}}
.bob{transform-box:fill-box;animation:bob 6s ease-in-out infinite alternate;animation-delay:var(--bd,0s)}
.globe-float{animation:bob 7.5s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(48px)}}
.cloud{animation:drift 80s ease-in-out infinite alternate}
.cloud.c2{animation-duration:105s;animation-direction:alternate-reverse}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.6s ease-in-out infinite;animation-delay:var(--td,0s)}
@keyframes sway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:sway 4s ease-in-out infinite alternate;animation-delay:var(--fd,0s)}
@keyframes dashmarch{to{stroke-dashoffset:-130}}
.route{animation:dashmarch 5s linear infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.9}75%{transform:scale(2);opacity:0}100%{transform:scale(2);opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite;animation-delay:var(--pd,0s)}
@keyframes shoot{0%,86%{transform:translate(0,0);opacity:0}89%{opacity:1}96%{transform:translate(340px,175px);opacity:0}100%{transform:translate(340px,175px);opacity:0}}
.shoot{animation:shoot 10s linear infinite}

/* ───────────────────────────── hero (opening) ───────────────────────────── */
.hero{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:max(9vh,72px) 24px 0;pointer-events:none}
.title{margin:0;font-weight:400}
.t1{display:block;font-family:var(--hand);font-size:clamp(1.5rem,4vw,2.6rem);
  letter-spacing:.08em;color:var(--ink);margin-bottom:.35em}
.t1::before,.t1::after{content:"✦";font-size:.55em;vertical-align:.4em;margin:0 .8em;color:var(--red)}
.t1::after{color:var(--blue)}
.t2{display:block;font-family:var(--display);font-size:clamp(3rem,12vw,8rem);
  line-height:.95;letter-spacing:.015em}
.t2 .ltr{display:inline-block;color:var(--c);
  -webkit-text-stroke:.055em #fffaf0;
  text-shadow:0 .05em 0 rgba(56,49,59,.16)}
.sub{margin:1.15em 0 0;font-size:clamp(1rem,2vw,1.3rem);font-weight:400;
  letter-spacing:.06em;color:var(--ink-soft)}
.btn-wrap{display:inline-block;margin-top:2.1em}
.start{pointer-events:auto;display:inline-block;font-family:var(--hand);
  font-size:clamp(1.25rem,2.2vw,1.65rem);letter-spacing:.16em;color:#fff6e6;
  background:var(--red);padding:.5em 1.5em .58em;border-radius:22px 28px 20px 30px;
  transform:rotate(-2deg);text-decoration:none;border:0;cursor:pointer;
  box-shadow:0 0 0 .18em #fffaf0,0 .55em 0 -.18em rgba(56,49,59,.3);
  transition:transform .25s cubic-bezier(.2,1.2,.3,1),box-shadow .25s;
  animation:pulse 2.8s ease-in-out 1.8s infinite}
@keyframes pulse{50%{transform:rotate(-2deg) scale(1.04)}}
.start:hover{transform:rotate(0deg) translateY(-4px) scale(1.05);
  box-shadow:0 0 0 .18em #fffaf0,0 .8em 0 -.2em rgba(56,49,59,.3),0 1.2em 2em -.6em rgba(56,49,59,.35)}
.start:active{transform:rotate(-1deg) translateY(2px) scale(.97);
  box-shadow:0 0 0 .18em #fffaf0,0 .25em 0 -.1em rgba(56,49,59,.3)}
.start:focus-visible{outline:3px dashed var(--ink);outline-offset:6px}

/* entrance choreography */
.ent,.gent{transform:rotate(var(--r,0deg)) translateY(var(--y,0px))}
html.js .ent{opacity:0}
html.js body.open .ent{opacity:1;animation:pop .85s cubic-bezier(.2,1.3,.35,1) backwards;
  animation-delay:var(--d,0ms)}
html.js #globe-scene .gent{opacity:0}
html.js #globe-scene.active .gent{opacity:1;animation:pop .8s cubic-bezier(.2,1.3,.35,1) backwards;
  animation-delay:var(--d,0ms)}
@keyframes pop{
  0%{opacity:0;transform:translateY(40px) scale(.6) rotate(var(--r,0deg))}
  55%{opacity:1;transform:translateY(-8px) scale(1.06) rotate(var(--r,0deg))}
  100%{opacity:1;transform:rotate(var(--r,0deg)) translateY(var(--y,0px))}
}

/* ───────────────────────────── globe scene ui ───────────────────────────── */
.globe-ui{position:absolute;inset:0;z-index:10;pointer-events:none}
.cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
  margin:0;font-family:var(--hand);font-size:clamp(1rem,2vw,1.3rem);
  letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.cap::before,.cap::after{content:"✦";font-size:.7em;margin:0 .8em;color:var(--red)}
.cap::after{color:var(--blue)}
.back{pointer-events:auto;position:absolute;right:18px;bottom:16px;width:54px;height:54px;
  display:grid;place-items:center;background:var(--cream);border-radius:50% 46% 52% 48%;
  box-shadow:0 0 0 .22em #fffaf0,0 .45em 0 -.12em rgba(56,49,59,.28);
  transition:transform .25s cubic-bezier(.2,1.2,.3,1)}
.back:hover{transform:rotate(-8deg) scale(1.07)}
.back:focus-visible{outline:3px dashed var(--ink);outline-offset:5px}
.back svg{width:28px;height:28px}

/* ───────────────────────────── watermark ───────────────────────────── */
.wm{position:fixed;left:18px;bottom:14px;z-index:90;pointer-events:none;
  font-family:var(--hand);font-size:15px;letter-spacing:.06em;color:var(--ink);opacity:.62}

/* ───────────────────────────── intro: black screen + cake cursor ───────────────────────────── */
#intro{display:none}
html.js #intro{display:block;position:fixed;inset:0;z-index:60;cursor:pointer}
#fx{--mx:50%}
.veil{position:absolute;inset:0;background:#0e0c14;transition:opacity .8s ease .05s;will-change:opacity;
  -webkit-mask-image:linear-gradient(to right,transparent 0,transparent calc(var(--mx,50%) - 12vmin),rgba(0,0,0,.5) calc(var(--mx,50%) - 4vmin),#000 calc(var(--mx,50%) + 2vmin));
  mask-image:linear-gradient(to right,transparent 0,transparent calc(var(--mx,50%) - 12vmin),rgba(0,0,0,.5) calc(var(--mx,50%) - 4vmin),#000 calc(var(--mx,50%) + 2vmin))}
#intro.done .veil{opacity:0}
.glow{position:absolute;top:50%;left:var(--mx,50%);width:52vmin;height:52vmin;pointer-events:none;
  transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,210,140,.4),rgba(255,190,120,.12) 45%,transparent 68%);
  animation:glowpulse 2.2s ease-in-out infinite;transition:opacity .5s}
#intro.done .glow{opacity:0}
@keyframes glowpulse{0%,100%{opacity:.9}50%{opacity:.55}}
.cake{position:absolute;top:50%;left:var(--mx,50%);width:clamp(120px,20vmin,190px);
  transform:translate(-50%,-50%);pointer-events:none}
html.js .cake{animation:cakein .6s .25s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes cakein{from{transform:translate(-50%,-50%) scale(0) rotate(-14deg);opacity:0}}
#intro.done .cake{opacity:0;transition:opacity .4s}
#intro.launch .cake{animation:launch .55s ease-in forwards}
@keyframes launch{40%{transform:translate(-50%,-50%) scale(1.12)}
  100%{transform:translate(-50%,-50%) translateY(-18vmin) scale(1.5);opacity:0}}
.hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7d7590;opacity:.75;
  transition:opacity .4s;pointer-events:none}
#intro.done .hint{opacity:0}
@keyframes flame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(.9,1.12) rotate(2.6deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .3s ease-in-out infinite}

/* ───────────────────────────── transition particles ───────────────────────────── */
#fxlayer{position:fixed;inset:0;z-index:84;pointer-events:none}
.pt{position:fixed;z-index:84;pointer-events:none}
.pt.spark{width:var(--s);height:var(--s);background:var(--c);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:sparkfly var(--dur) cubic-bezier(.1,.7,.3,1) forwards}
@keyframes sparkfly{0%{transform:translate(-50%,-50%) rotate(0) scale(1);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.15);opacity:0}}
.pt.puff{width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#f4e6f0 55%,rgba(244,230,240,0) 75%);
  filter:blur(1.5px);animation:pufffly var(--dur) ease-out forwards}
@keyframes pufffly{0%{transform:translate(-50%,-50%) scale(.4);opacity:.95}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.4);opacity:0}}
.poof{position:fixed;z-index:83;width:74vmin;height:74vmin;pointer-events:none;
  transform:translate(-50%,-50%) scale(0);border-radius:50%;filter:blur(8px);
  background:radial-gradient(circle,#fffaf2 0%,#f7e9f2 42%,rgba(247,233,242,0) 70%);
  animation:poof 1.05s ease-out forwards}
@keyframes poof{0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  30%{opacity:.95}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* ───────────────────────────── responsive & a11y ───────────────────────────── */
@media (max-width:640px){
  .hero{padding-top:11vh}
  .wm{font-size:12px;left:12px;bottom:10px}
  .cap{font-size:.95rem;bottom:26px}
  .back{width:46px;height:46px;right:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){
  .wheel,.cab,.bob,.globe-float,.cloud,.tw,.flag,.flame,.start,.glow,.shoot,.route,.ping{animation:none!important}
  html.js body.open .ent,html.js #globe-scene.active .gent{animation-name:fadein;animation-duration:.45s}
  #opening,#globe-scene{transition-duration:.3s}
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>

  (function bunting(){
    var g = document.getElementById('bunt'); if(!g) return;
    var strings = [
      {p0:[-30,110], c:[720,240],  p1:[1470,95],  drop:34, w:15},
      {p0:[-30,320], c:[305,470],  p1:[610,368],  drop:28, w:12},
      {p0:[1470,168],c:[1380,190], p1:[1280,252], drop:24, w:11}
    ];
    strings.forEach(function(s, si){
      el('path', {d:'M'+s.p0[0]+' '+s.p0[1]+' Q'+s.c[0]+' '+s.c[1]+' '+s.p1[0]+' '+s.p1[1],
        fill:'none', stroke:'#38313b', 'stroke-width':2.5, opacity:.8}, g);
      var n = Math.max(6, Math.round(26 - si*6));
      for (var i=1;i<n;i++){
        var t = i/n, mt = 1-t;
        var x = mt*mt*s.p0[0] + 2*mt*t*s.c[0] + t*t*s.p1[0];
        var y = mt*mt*s.p0[1] + 2*mt*t*s.c[1] + t*t*s.p1[1];
        var fg = el('g', {class:'flag', style:'--fd:'+(-R()*4).toFixed(2)+'s'}, g);
        el('path', {d:'M'+x.toFixed(1)+' '+y.toFixed(1)+
          ' L'+(x-s.w).toFixed(1)+' '+(y+s.drop).toFixed(1)+
          ' Q'+x.toFixed(1)+' '+(y+s.drop+8).toFixed(1)+' '+(x+s.w).toFixed(1)+' '+(y+s.drop).toFixed(1)+' Z',
          fill:PAL[(i+si)%PAL.length], stroke:'#38313b', 'stroke-width':2, 'stroke-linejoin':'round'}, fg);
        el('circle', {cx:x.toFixed(1), cy:y.toFixed(1), r:2, fill:'#38313b', opacity:.7}, fg);
      }
    });
  })();

  (function lights(){
    var g = document.getElementById('lights'); if(!g) return;
    var segs = [{p0:[584,560], c:[652,549], p1:[720,470]},
                {p0:[720,470],  c:[788,549], p1:[856,560]}];
    var cols = ['#ffd98a','#f6c945','#ef7fae','#8fb6d9'], ci = 0;
    segs.forEach(function(s){
      for (var i=1;i<12;i++){
        var t = i/12, mt = 1-t;
        var x = mt*mt*s.p0[0] + 2*mt*t*s.c[0] + t*t*s.p1[0];
        var y = mt*mt*s.p0[1] + 2*mt*t*s.c[1] + t*t*s.p1[1];
        var c = el('circle', {cx:x.toFixed(1), cy:y.toFixed(1), r:2.7, fill:cols[ci++ % 4]}, g);
        if (ci % 4 === 1){ c.setAttribute('class','tw');
          c.setAttribute('style','--td:'+(-R()*3).toFixed(2)+'s'); }
      }
    });
  })();

  (function confetti(){
    var g = document.getElementById('confetti'); if(!g) return;
    for (var i=0;i<26;i++){
      el('circle', {cx:((R()*1440)|0), cy:(40+R()*540|0), r:(2+R()*2.4).toFixed(1),
        fill:PAL[(R()*6)|0], opacity:.5}, g);
    }
  })();

  (function flowers(){
    var g = document.getElementById('flowers'); if(!g) return;
    var cols = ['#e8b4b8','#f6c945','#8fb6d9','#c65b4e','#dfa8b0'];
    for (var i=0;i<9;i++){
      var x = 40 + R()*1360, y = 826 + R()*48;
      if (x > 620 && x < 820) x += 160;
      var f = el('g', {}, g);
      el('line', {x1:x.toFixed(1), y1:(y+4).toFixed(1), x2:x.toFixed(1), y2:(y+15).toFixed(1),
        stroke:'#5f7350', 'stroke-width':2.5}, f);
      for (var k=0;k<5;k++){
        var a = k/5*Math.PI*2 - Math.PI/2;
        el('circle', {cx:(x+6.5*Math.cos(a)).toFixed(1), cy:(y+6.5*Math.sin(a)).toFixed(1),
          r:4, fill:cols[(i+k)%5], stroke:'#fff', 'stroke-width':1.2}, f);
      }
      el('circle', {cx:x.toFixed(1), cy:y.toFixed(1), r:3.2, fill:'#f6ead2', stroke:'#38313b', 'stroke-width':1.5}, f);
    }
  })();

  /* ── globe scene stars ── */
  (function stars2(){
    var g = document.getElementById('stars2'); if(!g) return;
    for (var i=0;i<30;i++){
      var s = el('path', {d:STAR, fill:'#fff7e2', transform:'translate('+
        ((R()*1440)|0)+' '+(30+R()*520|0)+') scale('+(0.45+R()*0.85).toFixed(2)+')'}, g);
      if (R() < .6){ s.setAttribute('class','tw');
        s.setAttribute('style','--td:'+(-R()*4).toFixed(2)+'s'); }
    }
  })();

  /* ── intro: black screen, cake cursor reveal ── */
  var intro = document.getElementById('intro');
  var fx = document.getElementById('fx');
  var opened = false;

  function open(){
    if (opened) return; opened = true;
    document.body.classList.add('open');
    intro.classList.add('done');
    setTimeout(function(){ if (intro.parentNode) intro.parentNode.removeChild(intro); }, 1000);
  }

  if (reduced){
    setTimeout(open, 650);
    intro.addEventListener('click', open);
  } else {
    var DELAY = 1000, DUR = 3200;
    function ease(k){ return k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2; }
    function frame(now){
      if (opened) return;
      var k = Math.min(1, (now - DELAY) / DUR);
      var x = -8 + 118 * ease(Math.max(0, k));
      fx.style.setProperty('--mx', x + '%');
      if (k < 1) requestAnimationFrame(frame); else finish();
    }
    function finish(){
      intro.classList.add('launch');
      setTimeout(open, 430);
    }
    requestAnimationFrame(frame);
    intro.addEventListener('click', function(){
      if (opened) return;
      fx.style.setProperty('--mx', '110%');
      finish();
    });
    window.addEventListener('keydown', function(e){
      if (!opened && (e.key === 'Escape' || e.key === 'Enter')){
        fx.style.setProperty('--mx', '110%');
        finish();
      }
    });
  }

  /* ── scene navigation: smoke + sparkle transition ── */
  var opening = document.getElementById('opening');
  var globe = document.getElementById('globe-scene');
  var startBtn = document.getElementById('startBtn');
  var backBtn = document.getElementById('backBtn');
  var layer = document.getElementById('fxlayer');
  var R2 = rng(1120);

  function burst(x, y){
    if (reduced) return;
    var cols = ['#f6c945','#ef7fae','#8fb6d9','#c65b4e','#8a9b6e','#fffaf0'];
    var i, s, a, d;
    for (i=0;i<24;i++){
      s = document.createElement('i');
      s.className = 'pt spark';
      a = R2()*Math.PI*2; d = 60 + R2()*150;
      s.style.cssText = 'left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px;'+
        '--s:'+(6+R2()*8)+'px;--c:'+cols[i%6]+';--dur:'+(0.6+R2()*0.5)+'s;--rot:'+((R2()*240)|0)+'deg';
      s.addEventListener('animationend', function(){ this.remove(); });
      layer.appendChild(s);
    }
    for (i=0;i<9;i++){
      s = document.createElement('i');
      s.className = 'pt puff';
      a = R2()*Math.PI*2; d = 30 + R2()*90;
      s.style.cssText = 'left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+(Math.sin(a)*d-24)+'px;'+
        '--s:'+(16+R2()*18)+'px;--dur:'+(0.8+R2()*0.5)+'s';
      s.addEventListener('animationend', function(){ this.remove(); });
      layer.appendChild(s);
    }
    var p = document.createElement('div');
    p.className = 'poof';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.addEventListener('animationend', function(){ this.remove(); });
    layer.appendChild(p);
  }

  function show(name){
    var toGlobe = (name === 'globe');
    opening.classList.toggle('active', !toGlobe);
    opening.setAttribute('aria-hidden', toGlobe ? 'true' : 'false');
    globe.classList.toggle('active', toGlobe);
    globe.setAttribute('aria-hidden', toGlobe ? 'false' : 'true');
  }

  startBtn.addEventListener('click', function(e){
    e.preventDefault();
    if (globe.classList.contains('active')) return;
    var r = startBtn.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2);
    setTimeout(function(){
      show('globe');
      setTimeout(function(){ backBtn.focus({preventScroll:true}); }, reduced ? 60 : 700);
    }, reduced ? 0 : 240);
  });

  backBtn.addEventListener('click', function(e){
    e.preventDefault();
    show('opening');
    setTimeout(function(){ startBtn.focus({preventScroll:true}); }, reduced ? 60 : 500);
  });

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && globe.classList.contains('active') && !intro.parentNode){
      show('opening');
    }
  });
})();
</script>
</body>
</html>
